name: mirror-to-personal

# 镜像方向：xiaozhiaixue/dsh-archive-panel -> realpkuasule/dsh-archive-panel
# push 默认分支即触发；无变化自动跳过。树级镜像（含删除同步）。
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone personal mirror
        env:
          TOKEN: ${{ secrets.MIRROR_PAT }}
        run: git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/realpkuasule/dsh-archive-panel.git" /tmp/mirror

      - name: Sync tree into mirror
        run: rsync -a --delete --exclude='.git' --exclude='.github/workflows' "$GITHUB_WORKSPACE/" /tmp/mirror/

      - name: Commit and push snapshot
        env:
          TOKEN: ${{ secrets.MIRROR_PAT }}
        run: |
          cd /tmp/mirror
          git config user.name realpkuasule
          git config user.email realpkuasule@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "no changes, skip"
            exit 0
          fi
          git commit -m "mirror sync from xiaozhiaixue/dsh-archive-panel ${GITHUB_SHA::8} ($(date -u '+%Y-%m-%d %H:%M') UTC)"
          git push "https://x-access-token:${TOKEN}@github.com/realpkuasule/dsh-archive-panel.git" HEAD:main
